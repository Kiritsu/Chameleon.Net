name: Release

# Push a tag such as v0.1.0 (or v0.1.0-preview.1) to publish that version to nuget.org and create a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release
  id-token: write # nuget.org trusted publishing

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer derives the version from the tag

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Chameleon.Net.slnx -c Release

      - name: Test
        run: dotnet test --solution Chameleon.Net.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Chameleon.Net.slnx -c Release --no-build -o artifacts

      # Trusted publishing: no stored API key. Needs a policy on nuget.org for this repository and release.yml,
      # and the NUGET_USER secret (your nuget.org user name).
      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
