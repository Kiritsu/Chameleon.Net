name: Bug report
description: Something doesn't work, crashes, or a fingerprint doesn't match the real client.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please redact cookies, tokens, credentials and any other secrets from
        code, logs and captures before posting them.

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Chameleon.Net
        - Chameleon.Net.Extensions.Http
        - Chameleon.Net.Inspector
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The package version, or the commit if you build from source.
      placeholder: "1.4.0"
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: Profile
      description: The profile in use (e.g. `BuiltInProfiles.Chrome154Windows`), or "custom" if you built your own.
      placeholder: "BuiltInProfiles.Firefox156Windows"

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the problem show up?
      multiple: true
      options:
        - TLS (ClientHello, handshake, resumption)
        - HTTP/2 (preface, frames, HPACK, priorities)
        - HTTP/1.1
        - Headers (order, casing, defaults)
        - WebSocket
        - Proxy (HTTP CONNECT / SOCKS5)
        - Connection pooling, redirects, cookies or decompression
        - IHttpClientFactory / dependency injection
        - Inspector
        - Other / not sure

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or list of steps. A public endpoint that shows the problem helps a lot.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected instead. For fingerprint mismatches, what the real client sends.
    validations:
      required: true

  - type: textarea
    id: fingerprints
    attributes:
      label: Fingerprints
      description: |
        For fingerprint mismatches: JA3/JA4, Akamai HTTP/2 string or header list from Chameleon.Net and from the real
        client, as seen by the Inspector or an echo service such as tls.peet.ws.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Exception and logs
      description: The full exception with its stack trace, and any relevant logs.
      render: text

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2, Ubuntu 24.04, macOS 26..."
    validations:
      required: true

  - type: input
    id: dotnet
    attributes:
      label: .NET version
      description: Output of `dotnet --version`.
      placeholder: "10.0.303"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Proxy in use, the CDN or server involved, anything else that might help.
